type Employee {
  id: ID!
  employeeCode: String!
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  departmentId: Int!
  designation: String!
  salary: Float
  joiningDate: String
  isActive: Boolean!  
  department: Department
}
input CreateEmployeeInput {
  firstName: String!
  lastName: String!
  email: String!
  departmentId: Int!
  designation: String!
  joiningDate: String!
  phone: String
}

input UpdateEmployeeInput {  
  firstName: String
  lastName: String 
  phone: String
  departmentId: Int
  designation: String
  salary: Float
}

type EmployeeEdge {
  cursor: String!
  node: Employee!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type EmployeeConnection {
  edges: [EmployeeEdge!]!
  pageInfo: PageInfo!
}

type DeleteEmployeeResponse {
  success: Boolean!
  message: String!
  deletedId: ID
}
enum EmployeeSortField {
  EMPLOYEE_CODE
  FIRST_NAME
  LAST_NAME
  EMAIL
  JOINING_DATE    
}

enum SortOrder {
  ASC
  DESC
}

input EmployeeSortInput {
  field: EmployeeSortField!
  order: SortOrder = ASC
}
input EmployeeSearchInput {
  search: String
  first: Int!
  after: String
  sortBy: EmployeeSortInput
  departmentId: Int 
}

type Mutation {
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!
  deleteEmployee(id: ID!): DeleteEmployeeResponse!
}
type Query {
  employees(input: EmployeeSearchInput!): EmployeeConnection!
  employee(id: ID!): Employee
}
