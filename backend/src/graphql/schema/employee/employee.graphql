type Employee {
  id: ID!
  employeeCode: String!
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  department: String!
  designation: String!
  salary: Float
  joiningDate: String
  isActive: Boolean!
}
input CreateEmployeeInput {
  firstName: String!
  lastName: String!
  email: String!
  department: String!
  designation: String!
  joiningDate: String!
  phone: String
}

input UpdateEmployeeInput {  
  firstName: String
  lastName: String 
  phone: String
  department: String
  designation: String
  salary: Float
}

type EmployeeEdge {
  cursor: String!
  node: Employee!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type EmployeeConnection {
  edges: [EmployeeEdge!]!
  pageInfo: PageInfo!
}

type DeleteEmployeeResponse {
  success: Boolean!
  message: String!
  deletedId: ID
}

type Mutation {
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!
  deleteEmployee(id: ID!): DeleteEmployeeResponse!
}
type Query {
  employees(first: Int = 10, after: String): EmployeeConnection!
  employee(id: ID!): Employee
}
